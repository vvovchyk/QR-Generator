<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Створюйте QR-коди з власним розміром і кольорами та завантажуйте їх у форматі PNG.">
    <meta name="theme-color" content="#f5f7fb">
    <title>Генератор QR-кодів</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <p class="eyebrow">Безкоштовно · прямо у браузері</p>
            <h1>Генератор QR-кодів</h1>
            <p class="intro">Створіть QR-код для посилання або будь-якого тексту та збережіть його як PNG.</p>
        </header>

        <form id="qrForm">
            <div class="field">
                <label for="qrInput">Текст або посилання</label>
                <input
                    type="text"
                    id="qrInput"
                    placeholder="https://example.com"
                    autocomplete="url"
                    required
                >
            </div>

            <div class="settings">
                <div class="field">
                    <label for="qrSize">Розмір зображення</label>
                    <select id="qrSize">
                        <option value="200">200 × 200 px</option>
                        <option value="300" selected>300 × 300 px</option>
                        <option value="400">400 × 400 px</option>
                        <option value="500">500 × 500 px</option>
                    </select>
                </div>

                <div class="field">
                    <label for="darkColor">Колір QR-коду</label>
                    <input type="color" id="darkColor" value="#000000">
                </div>

                <div class="field">
                    <label for="lightColor">Колір фону</label>
                    <input type="color" id="lightColor" value="#ffffff">
                </div>
            </div>

            <div class="buttons">
                <button class="button-primary" type="submit">Згенерувати QR-код</button>
                <button class="button-secondary" id="downloadButton" type="button" disabled>Завантажити PNG</button>
            </div>
        </form>

        <section class="preview" aria-labelledby="previewTitle">
            <h2 id="previewTitle">Попередній перегляд</h2>
            <div id="qrcode" aria-label="Згенерований QR-код"></div>
            <p id="status" class="status" role="status" aria-live="polite">Введіть текст або посилання, щоб створити QR-код.</p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
